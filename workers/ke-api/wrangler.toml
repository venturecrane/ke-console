name = "ke-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "ke-main"
database_id = "8a876b33-faf8-4267-bd08-770b76786dcb"

# Environment variables (set via wrangler secret for production)
# RESEND_API_KEY - API key for Resend email service
# APP_URL - Base URL for the app (e.g., https://ke-console.vercel.app)
# CLERK_DOMAIN - Clerk instance domain for JWT verification (e.g., clerk.example.com)
# CLERK_ISSUER_URL - Expected JWT issuer URL (e.g., https://clerk.example.com). If not set, derived from CLERK_DOMAIN.
# STRIPE_SECRET_KEY - Stripe API secret key for billing
# STRIPE_WEBHOOK_SECRET - Stripe webhook signing secret

[vars]
APP_URL = "https://ke-console.vercel.app"

# Cron trigger: generate recurring expenses on 1st of each month at 6am UTC
[triggers]
crons = ["0 6 1 * *"]
